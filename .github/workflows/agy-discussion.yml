name: AirboxVIP-Coffeenet AGY Discussion Responder

on:
  discussion_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  discussions: write

jobs:
  discussion-responder:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >
      github.event_name == 'discussion_comment' &&
      startsWith(github.event.comment.body, '@agy') &&
      github.event.comment.user.type != 'Bot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build context prompt
        id: prompt
        env:
          USER_COMMENT: ${{ github.event.comment.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_NUM: ${{ github.event.discussion.number }}
          DISCUSSION_NODE: ${{ github.event.discussion.node_id }}
        run: |
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_COMMENT=$(printf '%s' "$USER_COMMENT" | sanitize)
          SAFE_DT=$(printf '%s' "$DISCUSSION_TITLE" | sanitize)
          SAFE_DB=$(printf '%s' "$DISCUSSION_BODY" | sanitize)
          {
            printf '%s\n' 'You are AGY, an AI assistant for AirboxVIP-Coffeenet project.'
            printf '%s\n' 'This is a Telegram bot for managing WiFi at coffee shops.'
            printf '%s\n' 'Read the discussion context below and answer the user question.'
            printf '%s\n' ''
            printf '%s\n' 'OUTPUT FORMAT: Output only the answer text. No preamble.'
            printf '%s\n' 'LANGUAGE: Answer in same language as the user question.'
            printf '%s\n' ''
            printf 'DISCUSSION #%s: %s\n' "$DISCUSSION_NUM" "$SAFE_DT"
            printf '%s\n' '---'
            printf '%s\n' "$SAFE_DB"
            printf '%s\n' '---'
            printf '%s\n' ''
            printf '%s\n' 'USER COMMENT:'
            printf '%s\n' "$SAFE_COMMENT"
            printf '%s\n' ''
            printf '%s\n' 'INSTRUCTIONS:'
            printf '%s\n' ''
            printf '%s\n' 'CASE A - User is asking a question:'
            printf '%s\n' '  Answer based on the context. Output only the answer.'
            printf '%s\n' '  The workflow will post it to the Discussion automatically.'
            printf '%s\n' ''
            printf '%s\n' 'CASE B - User is requesting a code change or task:'
            printf '%s\n' '  You have NO git credential and NO GitHub API token in your environment --'
            printf '%s\n' '  do not attempt to authenticate to GitHub, and do not ask for a token.'
            printf '%s\n' '  You cannot create an issue yourself. Instead output a proposal in exactly'
            printf '%s\n' '  this form:'
            printf '%s\n' '  ISSUE PROPOSAL: <short title>'
            printf '%s\n' '  <detailed task description>'
            printf '%s\n' '  A human will review and create the issue from this text.'
          } > /tmp/prompt.txt
          printf 'Prompt: %s lines\n' "$(wc -l < /tmp/prompt.txt)"
          DISC_IDX=$(( DISCUSSION_NUM % 9 ))
          echo "acc_index=$DISC_IDX" >> "$GITHUB_OUTPUT"

      - name: Dispatch, wait and collect
        id: dispatch
        env:
          ACC0_PAT: ${{ secrets.ACC0_PAT }}
          ACC1_PAT: ${{ secrets.ACC1_PAT }}
          ACC2_PAT: ${{ secrets.ACC2_PAT }}
          ACC3_PAT: ${{ secrets.ACC3_PAT }}
          ACC4_PAT: ${{ secrets.ACC4_PAT }}
          ACC5_PAT: ${{ secrets.ACC5_PAT }}
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
          ACC7_PAT: ${{ secrets.ACC7_PAT }}
          ACC8_PAT: ${{ secrets.ACC8_PAT }}
        run: |
          DISC_IDX="${{ steps.prompt.outputs.acc_index }}"
          case $DISC_IDX in
            0) DISPATCH_REPO="Mohammadlali/agw-workers";           DISPATCH_TOKEN="$ACC0_PAT" ;;
            1) DISPATCH_REPO="momonakikugava-pixel/agw-workers";   DISPATCH_TOKEN="$ACC1_PAT" ;;
            2) DISPATCH_REPO="lali94m-max/agw-workers";            DISPATCH_TOKEN="$ACC2_PAT" ;;
            3) DISPATCH_REPO="ngocgminh5-debug/agw-workers";       DISPATCH_TOKEN="$ACC3_PAT" ;;
            4) DISPATCH_REPO="hmmletssee7-design/agw-workers";     DISPATCH_TOKEN="$ACC4_PAT" ;;
            5) DISPATCH_REPO="kidding602/agw-workers";             DISPATCH_TOKEN="$ACC5_PAT" ;;
            6) DISPATCH_REPO="mohammadlali0707-stack/agw-workers"; DISPATCH_TOKEN="$ACC6_PAT" ;;
            7) DISPATCH_REPO="mohammad97okk/agw-workers";          DISPATCH_TOKEN="$ACC7_PAT" ;;
            8) DISPATCH_REPO="moradzahra85-png/agw-workers";       DISPATCH_TOKEN="$ACC8_PAT" ;;
          esac
          export GH_TOKEN="$DISPATCH_TOKEN"
          echo "Dispatching discussion #${{ github.event.discussion.number }} to $DISPATCH_REPO (acc=$DISC_IDX)"
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo "$DISPATCH_REPO" \
            --field "prompt=$PROMPT" \
            --field "acc_index=$(( DISC_IDX + 1 ))" \
            --field "callback_id=av-disc-${{ github.event.discussion.number }}-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo "$DISPATCH_REPO" \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "dispatch_repo=$DISPATCH_REPO" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 60); do
            ST=$(gh run view "$RUN_ID" --repo "$DISPATCH_REPO" --json status -q '.status')
            echo "[$i/60] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

          mkdir -p /tmp/agy-out
          gh run download "$RUN_ID" --repo "$DISPATCH_REPO" --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          if [ -n "$OUT" ]; then
            head -c 58000 "$OUT" > /tmp/final.txt
          else
            printf '%s\n' '(AGY produced no output)' > /tmp/final.txt
          fi

      - name: Post reply to Discussion
        env:
          AIRBOXVIP_TOKEN: ${{ secrets.AIRBOXVIP_PAT }}
          DISCUSSION_NODE: ${{ github.event.discussion.node_id }}
        run: |
          ANSWER=$(cat /tmp/final.txt)
          WORKER_URL="https://github.com/${{ steps.dispatch.outputs.dispatch_repo }}/actions/runs/${{ steps.dispatch.outputs.run_id }}"
          FULL_REPLY=$(printf '%s\n\n---\n*AGY worker: %s | acc: ${{ steps.prompt.outputs.acc_index }}*' "$ANSWER" "$WORKER_URL")
          jq -n \
            --arg node "$DISCUSSION_NODE" \
            --arg body "$FULL_REPLY" \
            '{query: "mutation($did: ID!, $body: String!) { addDiscussionComment(input: {discussionId: $did, body: $body}) { comment { id } } }", variables: {did: $node, body: $body}}' | \
          curl -sf -X POST https://api.github.com/graphql \
            -H "Authorization: Bearer $AIRBOXVIP_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- | jq '.data.addDiscussionComment.comment.id'
