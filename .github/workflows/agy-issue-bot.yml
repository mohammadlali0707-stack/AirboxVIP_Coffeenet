name: AirboxVIP-Coffeenet AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: write

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (endsWith(github.event.issue.body, '@agy') || endsWith(github.event.issue.body, '@agy\n') || endsWith(github.event.issue.body, '@agy\r\n')) && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issue_comment' && (endsWith(github.event.comment.body, '@agy') || endsWith(github.event.comment.body, '@agy\n') || endsWith(github.event.comment.body, '@agy\r\n')) && (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.user.login == 'claude[bot]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY is on it. Will reply when done."

      - name: Build prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BRANCH='main'
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          README=$(cat README.md 2>/dev/null | sanitize | head -50 || printf '%s' '(not found)')
          {
            printf '%s\n' 'You are AGY, an AI software engineer for AirboxVIP-Coffeenet.'
            printf '%s\n' 'This is a Telegram bot for managing WiFi vouchers at coffee shops.'
            printf 'Active branch: %s\n' "$BRANCH"
            printf '%s\n' ''
            printf '%s\n' '=== WORKING TREE ==='
            printf '%s\n' 'The current directory is already a clone of this repo on the active branch.'
            printf '%s\n' 'You have NO git credential and NO GitHub API token in your environment -- do'
            printf '%s\n' 'not attempt to authenticate to GitHub, and do not ask for a token. Edit files,'
            printf '%s\n' 'then run:'
            printf '%s\n' "  git config user.email 'agy-bot@airboxvip.local'"
            printf '%s\n' "  git config user.name 'AGY Bot'"
            printf '%s\n' '  git add -A && git commit -m YOUR_COMMIT_MESSAGE'
            printf '%s\n' 'Do NOT run git push and do NOT call any GitHub API yourself -- the pipeline'
            printf '%s\n' 'running you pushes your commit and posts your final output as the issue'
            printf '%s\n' 'comment on its own, after you finish, using a credential you never see.'
            printf '%s\n' ''
            printf '%s\n' '=== PROJECT README ==='
            printf '%s\n' "$README"
            printf '%s\n' ''
            printf 'TASK - Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            printf '%s\n' "$SAFE_BODY"
            if [ -n "$SAFE_COMMENT" ]; then
              printf '%s\n' ''
              printf '%s\n' 'LATEST COMMENT:'
              printf '%s\n' "$SAFE_COMMENT"
            fi
            printf '%s\n' ''
            printf '%s\n' '=== REQUIRED STEPS ==='
            printf '%s\n' 'STEP 0: Read the files relevant to this task and print a short DETAILED'
            printf '%s\n' '  planning checklist to stdout (exact file + function + evidence per item).'
            printf '%s\n' '  This is printed output only -- do not post it anywhere yourself.'
            printf '%s\n' 'STEP 1: Implement the task.'
            printf '%s\n' 'STEP 2: python3 Tools/run_gates.py (must pass).'
            printf '%s\n' 'STEP 3: git add -A && git commit -m YOUR_COMMIT_MESSAGE  (no push -- see above)'
            printf '%s\n' 'STEP 4: Print a final report to stdout, including the commit hash you made.'
            printf '%s\n' 'When you have COMPLETELY finished this task -- not a partial draft, nothing left to do -- end your final report with the line @claude on its own line, so Claude can continue from your result. If you are not fully done, do not include that line.'
          } > /tmp/prompt.txt
          ACC_IDX=$(( ISSUE_NUM % 9 ))
          echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"

      - name: Dispatch, wait and collect
        id: dispatch
        env:
          ACC0_PAT: ${{ secrets.ACC0_PAT }}
          ACC1_PAT: ${{ secrets.ACC1_PAT }}
          ACC2_PAT: ${{ secrets.ACC2_PAT }}
          ACC3_PAT: ${{ secrets.ACC3_PAT }}
          ACC4_PAT: ${{ secrets.ACC4_PAT }}
          ACC5_PAT: ${{ secrets.ACC5_PAT }}
          ACC6_PAT: ${{ secrets.ACC6_PAT }}
          ACC7_PAT: ${{ secrets.ACC7_PAT }}
          ACC8_PAT: ${{ secrets.ACC8_PAT }}
        run: |
          ACC_IDX="${{ steps.prompt.outputs.acc_index }}"
          case $ACC_IDX in
            0) DISPATCH_REPO="Mohammadlali/agw-workers";           DISPATCH_TOKEN="$ACC0_PAT" ;;
            1) DISPATCH_REPO="momonakikugava-pixel/agw-workers";   DISPATCH_TOKEN="$ACC1_PAT" ;;
            2) DISPATCH_REPO="lali94m-max/agw-workers";            DISPATCH_TOKEN="$ACC2_PAT" ;;
            3) DISPATCH_REPO="ngocgminh5-debug/agw-workers";       DISPATCH_TOKEN="$ACC3_PAT" ;;
            4) DISPATCH_REPO="hmmletssee7-design/agw-workers";     DISPATCH_TOKEN="$ACC4_PAT" ;;
            5) DISPATCH_REPO="kidding602/agw-workers";             DISPATCH_TOKEN="$ACC5_PAT" ;;
            6) DISPATCH_REPO="mohammadlali0707-stack/agw-workers"; DISPATCH_TOKEN="$ACC6_PAT" ;;
            7) DISPATCH_REPO="mohammad97okk/agw-workers";          DISPATCH_TOKEN="$ACC7_PAT" ;;
            8) DISPATCH_REPO="moradzahra85-png/agw-workers";       DISPATCH_TOKEN="$ACC8_PAT" ;;
          esac
          export GH_TOKEN="$DISPATCH_TOKEN"
          echo "Dispatching issue #${{ github.event.issue.number }} to $DISPATCH_REPO (acc=$ACC_IDX)"
          PROMPT=$(cat /tmp/prompt.txt)
          CALLBACK_ID="av-${{ github.event.issue.number }}-${{ github.run_id }}"
          gh workflow run agw-worker.yml \
            --repo "$DISPATCH_REPO" \
            --field "prompt=$PROMPT" \
            --field "target_repo=momonakikugava-pixel/AirboxVIP-Private" \
            --field "target_branch=main" \
            --field "acc_index=$(( ACC_IDX + 1 ))" \
            --field "callback_id=$CALLBACK_ID"
          sleep 10
          RUN_ID=$(gh run list --repo "$DISPATCH_REPO" \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "dispatch_repo=$DISPATCH_REPO" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 40); do
            ST=$(gh run view "$RUN_ID" --repo "$DISPATCH_REPO" --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api "repos/${{ github.repository }}/contents/Reports/agy/${CALLBACK_ID}.txt" \
            --jq '.content' 2>/dev/null | base64 -d > /tmp/final_raw.txt || true
          if [ -s /tmp/final_raw.txt ]; then
            head -c 58000 /tmp/final_raw.txt > /tmp/final.txt
          else
            printf '%s\n' '(no output found -- the worker may have failed before it could commit its output)' > /tmp/final.txt
          fi

      - name: Post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKER_URL="https://github.com/${{ steps.dispatch.outputs.dispatch_repo }}/actions/runs/${{ steps.dispatch.outputs.run_id }}"
          printf '*AGY worker: %s | acc: ${{ steps.prompt.outputs.acc_index }}*\n\n---\n\n%s\n' "$WORKER_URL" "$(cat /tmp/final.txt)" > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/comment.txt
