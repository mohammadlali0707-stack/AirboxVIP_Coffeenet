name: AirboxVIP-Coffeenet Morning Status Report

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  morning-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyyaml pytest 2>/dev/null || true

      - name: Generate Morning Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 Tools/generate_morning_report.py --output /tmp/morning_report.md
          cat /tmp/morning_report.md

      - name: Post Morning Report Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TODAY=$(date -u +'%Y-%m-%d')
          TITLE="[Morning Report] ${TODAY} - AirboxVIP-Coffeenet Daily Status"
          gh issue create \
            --repo "${REPO:-momonakikugava-pixel/AirboxVIP_Coffeenet}" \
            --title "$TITLE" \
            --body-file /tmp/morning_report.md
